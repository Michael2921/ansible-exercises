---

- name: Wait for SSH connection
  hosts: all
  gather_facts: False
  tasks:
    - name: Ensure SSH port open
      wait_for:
        port: 22
        delay: 10
        timeout: 100
        search_regex: OpenSSH
        host: '{{ (ansible_ssh_host|default(ansible_host))|default(inventory_hostname) }}'
  vars:
    ansible_connection: local
    ansible_python_interpreter: /usr/bin/python3



- name: Determine OS family
  hosts: all
  become: yes
  tasks:

    - name: Linux version
      ansible.builtin.setup:
        filter: ansible_os_family
        


    - name: Display OS family
      ansible.builtin.debug:
        msg: "{{ ansible_os_family }}"


- name: Branching based on OS family
  hosts: all
  become: yes
  tasks:

    - name: Branching
      ansible.builtin.include_tasks:
        file: "deploy_jenkins_docker_ubuntu.yaml"
      when: ansible_os_family in ['Debian']



- name: Install pip and other dependencies
  hosts: amazon
  become: yes
  tasks:

    - name: Install pip
      dnf:
        name: python3-pip
        state: present

    - name: Install docker module
      dnf:
        name: python3-docker
        state: present

    - name: Install paramiko module
      ansible.builtin.pip:
        name: paramiko


- name: Install docker and add user to group
  hosts: amazon
  become: yes
  tasks:

    - name: Install docker
      dnf:
        name: docker
        state: present

    - name: Add user to docker group
      user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Reconnect to server session
      meta: reset_connection

    - name: Start docker service
      ansible.builtin.systemd_service:
        state: started
        name: docker


- name: Run jenkins container
  hosts: amazon
  become: yes
  become_user: ec2-user
  tasks:

    - name: Run command
      community.docker.docker_container:
        name: jenkins
        ports: 
          - "8080:8080"
          - "50000:50000"
        detach: true
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - /usr/local/bin/docker:/usr/bin/docker
          - jenkins_home:/var/jenkins_home
        image: jenkins/jenkins:lts


- name: List running docker containers
  hosts: amazon
  become: yes
  become_user: ec2-user
  tasks:

    - name: List containers
      ansible.builtin.command: docker ps
      register: docker_ps
      changed_when: false



- name: Display output
  hosts: amazon
  become: yes
  become_user: ec2-user
  tasks:

    - name: Display running containers
      ansible.builtin.debug:
        var: docker_ps.stdout_lines
        




    



