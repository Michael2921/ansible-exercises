---


- name: Update packages
  apt:
    update_cache: true


- name: Install Java 
  apt:
    name: openjdk-21-jdk
    state: present


- name: Install nodejs and npm
  apt:
    name: nodejs
    state: present


- name: Install docker
  apt:
    name: docker.io
    state: present


- name: Add user to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes


- name: Reconnect to server session
  meta: reset_connection


- name: Download Jenkins public key
  ansible.builtin.get_url:
    url:  https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
    dest: /etc/apt/keyrings/jenkins-keyring.asc


- name: Specify Jenkins public key and remote download source
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
    filename: jenkins
    state: present
    update_cache: yes

- name: Install Jenkins
  apt:
    name: jenkins
    state: present


- name: Daemon reload
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: jenkins


- name: Start Jenkins service
  ansible.builtin.systemd_service:
    state: started
    name: jenkins


- name: Verify Jenkins status
  ansible.builtin.command: systemctl status docker
  register: docker_status
  changed_when: false
  failed_when: false


- name: Display status
  ansible.builtin.debug:
    var: docker_status.stdout_lines